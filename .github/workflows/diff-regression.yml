name: Differential Regression Eval

on:
  pull_request:
    types: [labeled, synchronize, opened]
    paths:
      - 'prompts/**'

jobs:
  diff_regression:
    if: contains(github.event.pull_request.labels.*.name, 'needs-regression-eval')
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout PR
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Fetch main
        run: git fetch origin main:main

      - name: Detect changed prompt files
        id: detect
        run: |
          # Each line: prompts/chat/v<N>/<model>.md
          changed=$(git diff --name-only origin/main..HEAD -- 'prompts/chat/**/*.md')
          if [ -z "$changed" ]; then
            echo "No prompt .md changes detected; skipping."
            echo "skip=true" >> $GITHUB_OUTPUT
            exit 0
          fi
          echo "skip=false" >> $GITHUB_OUTPUT
          # Multiline output for downstream steps
          {
            echo 'changed<<EOF'
            echo "$changed"
            echo 'EOF'
          } >> $GITHUB_OUTPUT
          echo "Changed prompt files:"
          echo "$changed"

      - name: Clone evals repo
        if: steps.detect.outputs.skip != 'true'
        env:
          EVALS_REPO_TOKEN: ${{ secrets.EVALS_REPO_TOKEN }}
        run: |
          git clone --depth 1 \
            https://x-access-token:${EVALS_REPO_TOKEN}@github.com/Firefox-AI/evals.git _evals

      - name: Set up Python
        if: steps.detect.outputs.skip != 'true'
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install evals deps
        if: steps.detect.outputs.skip != 'true'
        run: |
          cd _evals
          pip install -r requirements.txt

      - name: Run diff-regression suite (one run per changed model)
        if: steps.detect.outputs.skip != 'true'
        env:
          MLPA_TOKEN: ${{ secrets.MLPA_TOKEN }}
          FASTLY_TOKEN: ${{ secrets.FASTLY_TOKEN }}
          FXA_EMAIL: ${{ secrets.FXA_EMAIL }}
          FXA_PASSWORD: ${{ secrets.FXA_PASSWORD }}
          FXA_CLIENT_ID: ${{ secrets.FXA_CLIENT_ID }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          REMOTE_PROMPTS_PATH: ${{ github.workspace }}
          DIFF_REGRESSION_PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          set -e
          mkdir -p "$GITHUB_WORKSPACE/results"
          # Map model basename -> MLPA provider/model_id format. Add to this
          # case statement when introducing a new model.
          map_model() {
            case "$1" in
              gpt-oss-120b)               echo "mlpa:openai/gpt-oss-120b" ;;
              gemini-2.5-flash-lite)      echo "mlpa:google/gemini-2.5-flash-lite" ;;
              qwen3-235b-a22b-instruct-2507-maas) echo "mlpa:qwen/qwen3-235b-a22b-instruct-2507-maas" ;;
              *)
                echo "ERROR: unknown model '$1' — add a mapping in diff-regression.yml" >&2
                return 1
                ;;
            esac
          }

          # Pull the list of changed prompt files (already in $GITHUB_OUTPUT
          # but re-derive here to avoid quoting headaches).
          changed_files=$(git diff --name-only origin/main..HEAD -- 'prompts/chat/**/*.md')

          # Use unique model basenames so a PR touching v3+v4 of the same
          # model only runs once.
          models=$(echo "$changed_files" | sed -E 's|.*/([^/]+)\.md$|\1|' | sort -u)

          any_failed=0
          for model in $models; do
            full_name=$(map_model "$model") || { any_failed=1; continue; }
            echo ""
            echo "==> Running diff_regression for $model ($full_name)"

            # Use the highest-version prompt file changed for this model.
            candidate_path=$(echo "$changed_files" | grep "/$model\.md$" | sort -V | tail -n 1)
            git show "main:$candidate_path" > /tmp/baseline.md
            cp "$candidate_path" /tmp/candidate.md

            run_dir="$GITHUB_WORKSPACE/results/diff_regression__$model"
            mkdir -p "$run_dir"

            # Run the suite with this model. We override model_name via a
            # one-line sed so a single YAML supports any model.
            (
              cd _evals
              cp eval_suites/diff_regression.yaml /tmp/diff_regression.yaml.bak
              sed -E -i "s|^(    model_name:) mlpa:.*$|\\1 $full_name|" eval_suites/diff_regression.yaml
              DIFF_REGRESSION_BASELINE_PROMPT_PATH=/tmp/baseline.md \
                DIFF_REGRESSION_CANDIDATE_PROMPT_PATH=/tmp/candidate.md \
                DIFF_REGRESSION_OUTPUT_DIR="$run_dir" \
                python scripts/eval.py --suite diff_regression || any_failed=1
              # Restore YAML so a follow-up loop iteration starts from the
              # canonical default.
              mv /tmp/diff_regression.yaml.bak eval_suites/diff_regression.yaml
            )

            if [ -f "$run_dir/BLOCKED" ]; then
              echo "::error::diff_regression flagged BLOCK regressions for $model"
              any_failed=1
            fi
          done

          if [ "$any_failed" = "1" ]; then
            # Don't fail the step here — let the report-comment step run
            # first, then the final "Fail if blocked" step exits nonzero.
            touch "$GITHUB_WORKSPACE/results/ANY_BLOCKED"
          fi

      - name: Upload report artifacts
        if: steps.detect.outputs.skip != 'true' && always()
        uses: actions/upload-artifact@v4
        with:
          name: diff-regression-reports
          path: results/

      - name: Post PR comment
        if: steps.detect.outputs.skip != 'true' && always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const path = require('path');
            const root = 'results';
            const marker = '<!-- diff-regression-report -->';

            const sections = [];
            for (const entry of fs.readdirSync(root, { withFileTypes: true })) {
              if (!entry.isDirectory() || !entry.name.startsWith('diff_regression__')) continue;
              const model = entry.name.replace(/^diff_regression__/, '');
              const reportPath = path.join(root, entry.name, 'report.md');
              if (!fs.existsSync(reportPath)) continue;
              const blocked = fs.existsSync(path.join(root, entry.name, 'BLOCKED'));
              const status = blocked ? '🚫 BLOCK' : '✅';
              sections.push(`### ${status} ${model}\n\n${fs.readFileSync(reportPath, 'utf8')}`);
            }

            if (sections.length === 0) {
              console.log('No reports to post.');
              return;
            }

            const body = marker + '\n# Differential Regression Eval\n\n' + sections.join('\n\n---\n\n');
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner, repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const existing = comments.find(c => c.body && c.body.startsWith(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner, repo: context.repo.repo,
                comment_id: existing.id, body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: context.issue.number, body,
              });
            }

      - name: Fail if any model run was blocked
        if: steps.detect.outputs.skip != 'true' && hashFiles('results/ANY_BLOCKED') != ''
        run: |
          echo "::error::At least one model's diff_regression run flagged blocking regressions."
          exit 1
